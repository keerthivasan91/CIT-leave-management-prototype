{% extends "base.html" %}

{% block title %}Holiday Calendar - Faculty Leave Management{% endblock %}

{% block content %}
<div class="history-container" style="max-width:800px;">
  <h2>📅 Holiday Calendar</h2>

  {% if holidays %}
    <div class="table-wrapper">
      <table class="history-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Holiday</th>
          </tr>
        </thead>
        <tbody>
          {% for h in holidays %}
            <tr>
              <td>{{ h[1] }}</td>
              <td>{{ h[2] }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="no-records">
      <p>No holidays added.</p>
    </div>
  {% endif %}
</div>

<style>
.history-container h2 {
  color: #333;
  margin-bottom: 20px;
  font-size: 26px;
  text-align: center;
}

.table-wrapper {
  overflow-x: auto;
}

.history-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  min-width: 400px;
}

.history-table th, .history-table td {
  border: 1px solid #e0e0e0;
  padding: 10px 12px;
  text-align: center;
}

.history-table th {
  background: #667eea;
  color: #fff;
  font-weight: 600;
  position: sticky;
  top: 0;
}

.history-table tbody tr:nth-child(even) {
  background: #f8f9fa;
}

.history-table tbody tr:hover {
  background: #e2e6f0;
}

/* Print button */
.print-btn {
  background: #667eea;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.3s;
}
.print-btn:hover {
  background: #5461d2;
}

/* No-records message */
.no-records {
  text-align: center;
  padding: 40px;
  background: #f8f9fa;
  border-radius: 10px;
  color: #666;
  font-size: 18px;
}

/* Responsive */
@media (max-width: 768px) {
  .history-table th, .history-table td {
    padding: 8px 6px;
    font-size: 12px;
  }
  .history-container h2 {
    font-size: 22px;
  }
}
</style>
{% endblock %}
