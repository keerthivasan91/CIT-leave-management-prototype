<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - Faculty Leave Management System</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>🔐 Login</h1>
      <p>Faculty Leave Management System</p>
    </div>
    
    <form method="post" action="/login">
      <table>
        <tr>
          <td><label for="user_id">User ID</label></td>
          <td><input type="text" id="user_id" name="user_id" placeholder="Enter your User ID" required></td>
        </tr>
        <tr>
          <td><label for="password">Password</label></td>
          <td><input type="password" id="password" name="password" placeholder="Enter your password" required></td>
        </tr>
        <tr>
          <td><label for="role">Role</label></td>
          <td>
            <select id="role" name="role" required>
              <option value="">Select your role</option>
              <option value="faculty">👨‍🏫 Faculty</option>
              <option value="hod">👨‍💼 HOD</option>
              <option value="admin">👨‍💻 Principal</option>
            </select>
          </td>
        </tr>
      </table>
      <button type="submit" class="login-btn">Login</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
